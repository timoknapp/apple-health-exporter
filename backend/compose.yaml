services:
  health-coach:
    build:
      context: .
      dockerfile: Dockerfile
    image: health-coach-backend:local
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "${HEALTH_COACH_BIND_ADDRESS:-127.0.0.1}:${HEALTH_COACH_PORT:-8080}:8080"
    environment:
      HEALTH_COACH_DB_PATH: /data/coach.sqlite3
      HEALTH_COACH_TIMEZONE: "${HEALTH_COACH_TIMEZONE:-Europe/Berlin}"
      HEALTH_COACH_ALLOWED_HOSTS: "${HEALTH_COACH_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      HEALTH_COACH_INGEST_TOKEN_FILE: /run/secrets/health_coach_ingest_token
      HEALTH_COACH_MCP_TOKEN_FILE: /run/secrets/health_coach_mcp_token
    secrets:
      - health_coach_ingest_token
      - health_coach_mcp_token
    volumes:
      - health-coach-data:/data
      - health-coach-backups:/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

secrets:
  health_coach_ingest_token:
    file: "${HEALTH_COACH_INGEST_TOKEN_FILE_HOST:-./secrets/ingest_token}"
  health_coach_mcp_token:
    file: "${HEALTH_COACH_MCP_TOKEN_FILE_HOST:-./secrets/mcp_token}"

volumes:
  health-coach-data:
  health-coach-backups:
